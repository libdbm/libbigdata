name: libbigdata
description: A pure Dart library for big data manipulation with DataFrame API and query engine.
version: 1.0.0
repository: https://github.com/libdbm/libbigdata
issue_tracker: https://github.com/libdbm/libbigdata/issues

environment:
  sdk: ^3.8.1

executables:
  libbigdata: sql

topics:
  - dataframe
  - sql
  - parquet
  - analytics
  - csv

dependencies:
  meta: ^1.9.0
  collection: ^1.17.0
  path: ^1.8.0
  async: ^2.11.0
  typed_data: ^1.3.2
  convert: ^3.1.1
  crypto: ^3.0.3
  libcompress: ^1.2.1  # Compression codecs (lz4, snappy, gzip, zstd) + CRC32
  petitparser: ^7.0.2  # SQL parser
  args: ^2.4.2  # Command-line argument parsing
  logging: ^1.2.0  # Structured logging

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  benchmark_harness: ^2.2.0
